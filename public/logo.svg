<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Emerald Nature Gradient -->
    <linearGradient id="emblem-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2e12" />
      <stop offset="45%" stop-color="#1b5e20" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>

    <!-- Vibrant Leaf & Motion Gradient -->
    <linearGradient id="leaf-motion" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="50%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </linearGradient>

    <!-- Vitality Golden Sun Gradient -->
    <linearGradient id="sun-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb74d" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>

    <!-- Drop Shadow for Dimensionality -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#emblem-bg)" />
  <circle cx="50" cy="50" r="45" stroke="rgba(129, 199, 132, 0.4)" stroke-width="1.8" fill="none" />
  
  <!-- Subtle Concentric Botanical Orbit -->
  <circle cx="50" cy="50" r="39" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="3 3" fill="none" />

  <!-- The Stylized Bengali 'গ' Letter as Athlete & Living Leaf -->
  <g filter="url(#glow-shadow)">
    
    <!-- Left Leaf Curve & Body of 'গ' -->
    <!-- Botanical Leaf Form sweeping from bottom-left up into the crown loop of 'গ' -->
    <path d="M 28 70 C 22 56, 23 40, 36 31 C 45 25, 54 28, 54 37 C 54 44, 46 48, 39 49 C 32 50, 27 60, 31 69 Z" 
          fill="url(#leaf-motion)" />

    <!-- Delicate Inner Leaf Vein Line -->
    <path d="M 27 66 C 26 48, 35 38, 47 34" 
          stroke="#1b5e20" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Right Upright Athletic Spine & Grounding Stem of 'গ' -->
    <path d="M 64 34 L 64 68 C 64 71.5, 61 74, 57.5 74 C 54 74, 51 71.5, 51 68 L 51 47" 
          stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Dynamic Connecting Matra / Forward Momentum Arch -->
    <path d="M 40 33 Q 54 28, 68 31" 
          stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Golden Sun of Vitality / Athletic Head at the Crown -->
    <circle cx="64" cy="22" r="6" fill="url(#sun-glow)" />
    
    <!-- Micro Speed / Energy Particle Sparks -->
    <circle cx="75" cy="27" r="2.2" fill="#ffe082" opacity="0.9" />
    <circle cx="79" cy="35" r="1.5" fill="#ffb74d" opacity="0.75" />
    
  </g>
</svg>

